##
# GitHub Actions workflow to action on Pull Request closure.
#

name: Close Pull Request

on:
  pull_request:
    types:
      - closed

jobs:
  remove_lagoon_environment:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    container:
      # https://hub.docker.com/r/drevops/ci-runner
      image: drevops/ci-runner:26.10.0@sha256:36db4ee12da3372c86966fccd543e49c9470bca12e86eb5d4aad7904dd84a0dd
      env:
        TZ: ${{ vars.TZ || 'UTC' }}
        TERM: xterm-256color
        VORTEX_SSH_DISABLE_STRICT_HOST_KEY_CHECKING: "1"
        VORTEX_DEBUG: ${{ vars.VORTEX_DEBUG }}

    steps:
      - name: Preserve $HOME set in the container
        run: echo HOME=/root >> "$GITHUB_ENV" # https://github.com/actions/runner/issues/863

      # The merge ref of a closed PR may no longer exist, so the base branch is
      # checked out instead. Only '.env' and the tooling installer are used.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Fix Git ownership permissions
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Load environment variables from .env
        run: t=$(mktemp) && export -p >"${t}" && set -a && . ./.env && set +a && . "${t}" && env >> "$GITHUB_ENV"

      - name: Add SSH private key to the runner
        if: ${{ env.VORTEX_DEPLOY_SSH_PRIVATE_KEY != '' }}
        uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3 # v2.8.1
        with:
          key: ${{ secrets.VORTEX_DEPLOY_SSH_PRIVATE_KEY }}
          known_hosts: ${{ vars.VORTEX_DEPLOY_SSH_KNOWN_HOSTS || 'unnecessary' }}
        env:
          VORTEX_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.VORTEX_DEPLOY_SSH_PRIVATE_KEY }}

      - name: Install Vortex tooling
        run: ./scripts/vortex-tooling.sh

      # The Lagoon CLI removes the environment through the API, so removal does
      # not depend on the Lagoon webhook endpoint resolving the project.
      - name: Remove environment after a PR is closed
        run: ./vendor/drevops/vortex-tooling/src/vortex-deploy-lagoon
        env:
          VORTEX_DEPLOY_ACTION: destroy
          VORTEX_DEPLOY_LAGOON_BRANCH: pr-${{ github.event.pull_request.number }}
        timeout-minutes: 10
