favicon:
  mimetype: image/vnd.microsoft.icon
  path: themes/custom/drevops/dist/assets/favicon.ico
  use_default: 0
features:
  favicon: 1
components:
  logo:
    primary:
      light:
        desktop:
          path: themes/custom/drevops/dist/assets/logos/logo_primary_light_desktop.svg
        mobile:
          path: themes/custom/drevops/dist/assets/logos/logo_primary_light_mobile.svg
      dark:
        desktop:
          path: themes/custom/drevops/dist/assets/logos/logo_primary_dark_desktop.svg
        mobile:
          path: themes/custom/drevops/dist/assets/logos/logo_primary_dark_mobile.svg
    secondary:
      light:
        desktop:
          path: themes/custom/drevops/dist/assets/logos/logo_primary_light_desktop.svg
        mobile:
          path: themes/custom/drevops/dist/assets/logos/logo_primary_light_mobile.svg
      dark:
        desktop:
          path: themes/custom/drevops/dist/assets/logos/logo_primary_dark_desktop.svg
        mobile:
          path: themes/custom/drevops/dist/assets/logos/logo_primary_dark_mobile.svg
    image_alt: 'Logo image'
  site_slogan:
    content: 'A design system by Salsa Digital'
  header:
    theme: dark
    logo_type: default
    is_sticky: 1
  footer:
    theme: dark
    logo_type: default
    background_image:
      path: ''
  navigation:
    primary_navigation:
      dropdown: dropdown
      dropdown_columns: '4'
      dropdown_columns_fill: 0
      is_animated: 1
    secondary_navigation:
      dropdown: dropdown
      dropdown_columns: '4'
      dropdown_columns_fill: 0
      is_animated: 1
  link:
    new_window: 0
    external_new_window: 1
    external_override_domains: {  }
  skip_link:
    theme: light
  event_card:
    summary_length: '160'
  navigation_card:
    summary_length: '1000'
  promo_card:
    summary_length: '3000'
  publication_card:
    summary_length: '160'
    use_media_name: 1
  snippet:
    summary_length: '160'
  attachment:
    use_media_name: 1
colors:
  use_color_selector: 1
  use_brand_colors: 0
  brand:
    light:
      brand1: '#1e7582'
      brand2: '#eff6ff'
      brand3: '#1e7582'
    dark:
      brand1: '#96e7f4'
      brand2: '#152235'
      brand3: '#96e7f4'
  palette:
    light:
      background: '#eff6ff'
      border: '#8fa0b8'
      highlight: '#1e7582'
      heading: '#152235'
      body: '#2b394d'
      background_light: '#ffffff'
      background_dark: '#c8d9f3'
      border_light: '#c8d9f3'
      border_dark: '#425166'
      interaction_text: '#ffffff'
      interaction_background: '#1e7582'
      interaction_hover_text: '#ffffff'
      interaction_hover_background: '#045a65'
      interaction_focus: '#cd5b43'
      information: '#326971'
      warning: '#a37a00'
      error: '#b7202e'
      success: '#208436'
    dark:
      background: '#152235'
      border: '#425166'
      highlight: '#96e7f4'
      heading: '#ffffff'
      body: '#eff6ff'
      background_light: '#2b394d'
      background_dark: '#030d1e'
      border_light: '#5b6a80'
      border_dark: '#2b394d'
      interaction_text: '#030d1e'
      interaction_background: '#96e7f4'
      interaction_hover_text: '#030d1e'
      interaction_hover_background: '#e1fbff'
      interaction_focus: '#ff9c86'
      information: '#9cccd3'
      warning: '#ffcf3d'
      error: '#ea858f'
      success: '#8ce3a0'
optouts: {  }
