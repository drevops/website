services:
  do_base.twig.icon_assets:
    class: Drupal\do_base\Twig\IconAssetsExtension
    arguments: ['@theme.manager']
    tags:
      - { name: twig.extension }
  do_base.theme_color_subscriber:
    class: Drupal\do_base\EventSubscriber\ThemeColorSubscriber
    arguments: ['@class_resolver', '@theme_handler']
    tags:
      - { name: event_subscriber }
  do_base.preview_link_cache_subscriber:
    class: Drupal\do_base\EventSubscriber\PreviewLinkCacheSubscriber
    arguments: ['@page_cache_kill_switch']
    tags:
      - { name: event_subscriber }
