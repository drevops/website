services:
  logger.channel.do_base:
    parent: logger.channel_base
    arguments: ['do_base']
  Drupal\do_base\NavigationScriptHash:
    arguments: ['@extension.list.module', '@cache.default', '@logger.channel.do_base', '%app.root%']
  Drupal\do_base\Hook\AutomatedListPagerHook:
    arguments: ['@request_stack', '@pager.manager']
  do_base.twig.icon_assets:
    class: Drupal\do_base\Twig\IconAssetsExtension
    arguments: ['@theme.manager']
    tags:
      - { name: twig.extension }
  do_base.twig.image_dimensions:
    class: Drupal\do_base\Twig\ImageDimensionsExtension
    arguments: ['@image.factory', '@stream_wrapper_manager', '@entity_type.manager', '%app.root%']
    tags:
      - { name: twig.extension }
  do_base.theme_color_subscriber:
    class: Drupal\do_base\EventSubscriber\ThemeColorSubscriber
    arguments: ['@class_resolver', '@theme_handler']
    tags:
      - { name: event_subscriber }
  do_base.preview_link_cache_subscriber:
    class: Drupal\do_base\EventSubscriber\PreviewLinkCacheSubscriber
    arguments: ['@page_cache_kill_switch']
    tags:
      - { name: event_subscriber }
